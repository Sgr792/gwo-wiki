<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 646" role="img" aria-labelledby="title desc"><title id="title">资源 ID 与文件夹：一眼对上路径</title><desc id="desc">沿用“第一把枪”教程的 tutorial 命名空间。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#527196"/></marker></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172b45}.muted{fill:#506783}.accent{fill:#145cac}.good{fill:#17643d}.bad{fill:#a83232}</style><rect width="960" height="646" rx="18" fill="#fff"/><text x="32" y="48" class="text" font-size="30">资源 ID 与文件夹：一眼对上路径</text><text x="32" y="80" class="muted" font-size="19">沿用“第一把枪”教程的 tutorial 命名空间。</text><rect x="32" y="111" width="895" height="89" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="50" y="144" class="text" font-size="23">配置中的资源 ID</text><text x="50" y="175" class="muted" font-size="19">tutorial:skins/guns/training_rifle.png</text><path d="M475 201 L475 233" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="251" width="895" height="89" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="50" y="284" class="text" font-size="23">内容包中的真实文件</text><text x="50" y="315" class="muted" font-size="19">assets/tutorial/skins/guns/training_rifle.png</text><text x="32" y="396" class="accent" font-size="24">冒号前：命名空间</text><text x="540" y="396" class="accent" font-size="24">冒号后：资源路径</text><rect x="32" y="426" width="434" height="88" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="50" y="459" class="text" font-size="23">tutorial</text><text x="50" y="490" class="muted" font-size="19">assets/tutorial/</text><rect x="498" y="426" width="429" height="88" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="516" y="459" class="text" font-size="23">skins/guns/…</text><text x="516" y="490" class="muted" font-size="19">skins/guns/training_rifle.png</text><text x="32" y="566" class="text" font-size="21">先核对路径，再排查材质或模型；不要把磁盘绝对路径写进 JSON。</text><text x="32" y="604" class="muted" font-size="20">这个规则适用于贴图等资源 ID；不是所有 JSON 字段都是资源 ID。</text></svg>
