<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">第一人称主链：父级到子级</title><desc id="desc">连线表示真实父子关系，不只是名字排列。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#527196"/></marker></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172b45}.muted{fill:#506783}.accent{fill:#145cac}.good{fill:#17643d}.bad{fill:#a83232}</style><rect width="960" height="630" rx="18" fill="#fff"/><text x="32" y="48" class="text" font-size="30">第一人称主链：父级到子级</text><text x="32" y="80" class="muted" font-size="19">连线表示真实父子关系，不只是名字排列。</text><rect x="42" y="108" width="215" height="54" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="60" y="141" class="text" font-size="23">root</text><path d="M148 162 L148 183" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="197" width="215" height="54" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="60" y="230" class="text" font-size="23">tag_view</text><path d="M257 224 L555 224" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="574" y="197" width="332" height="83" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="592" y="230" class="text" font-size="23">tag_camera</text><text x="592" y="261" class="muted" font-size="19">仅相机动画；不挂枪械部件</text><path d="M148 251 L148 272" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="287" width="215" height="54" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="60" y="320" class="text" font-size="23">tag_ads</text><path d="M148 341 L148 362" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="377" width="215" height="54" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="60" y="410" class="text" font-size="23">tag_weapon</text><path d="M148 431 L148 452" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="467" width="215" height="54" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="60" y="500" class="text" font-size="23">枪械主体</text><text x="310" y="315" class="accent" font-size="23">tag_camera 与 tag_ads 同级</text><text x="310" y="355" class="text" font-size="23">tag_weapon 是 tag_ads 的子级</text><path d="M257 494 L542 494" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="560" y="450" width="346" height="95" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="578" y="483" class="text" font-size="23">可动机构与挂点</text><text x="578" y="514" class="muted" font-size="19">tag_brass · tag_cosmetic</text><text x="42" y="584" class="muted" font-size="21">三条路线共用节点职责；额外机构放在枪械主体分支下。</text><text x="310" y="130" class="text" font-size="20">Blender 蒙皮：root 是 Armature 骨架对象，不是骨骼</text><text x="310" y="164" class="muted" font-size="19">Empty 路线：Empty 对象 · Bedrock 路线：根分组</text></svg>
