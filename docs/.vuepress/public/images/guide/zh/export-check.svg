<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">导出完成，不等于已经导出正确</title><desc id="desc">先在空工程复查，再用游戏检查实际表现。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#527196"/></marker></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172b45}.muted{fill:#506783}.accent{fill:#145cac}.good{fill:#17643d}.bad{fill:#a83232}</style><rect width="960" height="640" rx="18" fill="#fff"/><text x="32" y="48" class="text" font-size="30">导出完成，不等于已经导出正确</text><text x="32" y="80" class="muted" font-size="19">先在空工程复查，再用游戏检查实际表现。</text><rect x="32" y="110" width="895" height="87" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="50" y="143" class="text" font-size="23">保留源工程</text><text x="50" y="174" class="muted" font-size="19">Blender: .blend    /    Blockbench: .bbmodel</text><path d="M475 198 L475 225" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="243" width="433" height="112" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="50" y="276" class="text" font-size="23">Blender 导出</text><text x="50" y="307" class="muted" font-size="19">模型 .glb + 动画库 .anim.glb</text><rect x="498" y="243" width="429" height="112" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="516" y="276" class="text" font-size="23">Blockbench 导出</text><text x="516" y="307" class="muted" font-size="19">.geo.json + .animation.json + .png</text><text x="50" y="338" class="muted" font-size="19">需要的骨架 / Empty 不要漏选</text><text x="516" y="338" class="muted" font-size="19">不要把 .bbmodel 当成游戏模型</text><path d="M242 355 L242 400" fill="none" stroke="#527196" stroke-width="3"/><path d="M710 355 L710 400" fill="none" stroke="#527196" stroke-width="3"/><path d="M242 400 L710 400" fill="none" stroke="#527196" stroke-width="3"/><path d="M475 400 L475 437" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="455" width="895" height="87" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="50" y="488" class="text" font-size="23">重新导入 → 检查 → 再接入游戏</text><text x="50" y="519" class="muted" font-size="19">节点名 · 父子级 · 初始变换 · 动作名与时长</text><text x="32" y="594" class="text" font-size="22">模型和动画分开导出时，参考空间必须一致。</text></svg>
