<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">谁驱动网格？枢轴放在哪里？</title><desc id="desc">运动原理示意，不是软件界面截图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#527196"/></marker></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172b45}.muted{fill:#506783}.accent{fill:#145cac}.good{fill:#17643d}.bad{fill:#a83232}</style><rect width="960" height="600" rx="18" fill="#fff"/><text x="32" y="48" class="text" font-size="30">谁驱动网格？枢轴放在哪里？</text><text x="32" y="80" class="muted" font-size="19">运动原理示意，不是软件界面截图。</text><rect x="32" y="113" width="430" height="86" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="50" y="146" class="text" font-size="23">Blender 骨骼蒙皮</text><text x="50" y="177" class="muted" font-size="19">Armature → Bone → vertex weights</text><rect x="498" y="113" width="430" height="86" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="516" y="146" class="text" font-size="23">Blender Empty / Bedrock 分组</text><text x="516" y="177" class="muted" font-size="19">父级节点 / 分组 → 子网格 / 方块</text><text x="48" y="255" class="text" font-size="22">网格由权重决定跟随哪些骨骼。</text><text x="514" y="255" class="text" font-size="22">子部件整体跟随；不会弯曲变形。</text><g transform="translate(200 385)"><rect x="-28" y="-102" width="56" height="130" rx="5" fill="#bacadd"/><rect x="-28" y="-102" width="56" height="130" rx="5" fill="none" stroke="#9a7131" stroke-width="3" stroke-dasharray="8 6" transform="rotate(45)"/><circle r="10" fill="#145cac"/><path d="M0 -115 A115 115 0 0 1 81 -81" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/></g><path d="M215 385 L320 407" fill="none" stroke="#527196" stroke-width="3"/><text x="325" y="415" class="accent" font-size="24">枢轴</text><text x="520" y="330" class="accent" font-size="23">检查：旋转父级 / 骨骼</text><text x="520" y="374" class="text" font-size="22">只有目标部件跟随</text><text x="520" y="417" class="text" font-size="22">还原后，装配位置不变</text><text x="32" y="512" class="bad" font-size="23">错误示例：父级和子网格都烘焙同一段位移，会叠加两次。</text><text x="32" y="551" class="muted" font-size="20">枢轴放在真正转轴处；移动原点不能修复错误的父子关系。</text></svg>
