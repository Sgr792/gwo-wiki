<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 635" role="img" aria-labelledby="title desc"><title id="title">瞄准轨道：只让正确的节点参与</title><desc id="desc">这里只展示 ads_up / ads_down；其他动作按正文所有权表检查。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#527196"/></marker></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172b45}.muted{fill:#506783}.accent{fill:#145cac}.good{fill:#17643d}.bad{fill:#a83232}</style><rect width="960" height="635" rx="18" fill="#fff"/><text x="32" y="48" class="text" font-size="30">瞄准轨道：只让正确的节点参与</text><text x="32" y="80" class="muted" font-size="19">这里只展示 ads_up / ads_down；其他动作按正文所有权表检查。</text><text x="32" y="132" class="accent" font-size="25">ads_up / ads_down</text><text x="495" y="132" class="text" font-size="25">轨道所有权</text><rect x="32" y="168" width="895" height="59" rx="8" fill="#e7f4ed"/><text x="50" y="205" class="text" font-size="24">tag_ads</text><path d="M330 198 L654 198" fill="none" stroke="#527196" stroke-width="3"/><path d="M350 188 l10 10 l-10 10 l-10 -10Z" fill="#17643d"/><path d="M485 188 l10 10 l-10 10 l-10 -10Z" fill="#17643d"/><path d="M635 188 l10 10 l-10 10 l-10 -10Z" fill="#17643d"/><text x="695" y="205" class="good" font-size="21">保留</text><rect x="32" y="242" width="895" height="59" rx="8" fill="#f8ebeb"/><text x="50" y="279" class="text" font-size="24">tag_weapon</text><path d="M330 272 L654 272" fill="none" stroke="#527196" stroke-width="3"/><text x="695" y="279" class="bad" font-size="21">删除轨道</text><rect x="32" y="316" width="895" height="59" rx="8" fill="#f8ebeb"/><text x="50" y="353" class="text" font-size="24">tag_camera</text><path d="M330 346 L654 346" fill="none" stroke="#527196" stroke-width="3"/><text x="695" y="353" class="bad" font-size="21">删除轨道</text><rect x="32" y="390" width="895" height="59" rx="8" fill="#f8ebeb"/><text x="50" y="427" class="text" font-size="24">j_ammo_*</text><path d="M330 420 L654 420" fill="none" stroke="#527196" stroke-width="3"/><text x="695" y="427" class="bad" font-size="21">删除轨道</text><text x="32" y="510" class="text" font-size="22">删除无关轨道，不是把关键帧数值改成 0。</text><text x="32" y="550" class="muted" font-size="21">附加层也有自己的所有权：</text><text x="32" y="590" class="accent" font-size="21">ads_up_additive → tag_weapon   ·   bullet_additive → j_ammo_* / follower</text></svg>
