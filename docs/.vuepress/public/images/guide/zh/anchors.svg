<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">默认配件：对齐挂点，不是对齐世界原点</title><desc id="desc">示例枪管挂载关系；不要求所有枪使用相同几何形状。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#527196"/></marker></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172b45}.muted{fill:#506783}.accent{fill:#145cac}.good{fill:#17643d}.bad{fill:#a83232}</style><rect width="960" height="640" rx="18" fill="#fff"/><text x="32" y="48" class="text" font-size="30">默认配件：对齐挂点，不是对齐世界原点</text><text x="32" y="80" class="muted" font-size="19">示例枪管挂载关系；不要求所有枪使用相同几何形状。</text><path d="M145 305 L295 305 L295 258 L545 258 L545 278 L790 278 L790 302 L545 302 L545 340 L417 340 L391 425 L343 410 L355 340 L250 340 L180 375 L145 375Z" fill="#c5d0de" stroke="#7388a2" stroke-width="3"/><path d="M610 342 L854 342" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><text x="615" y="380" class="accent" font-size="24">枪口朝 +X</text><circle cx="545" cy="288" r="9" fill="#145cac"/><circle cx="378" cy="340" r="9" fill="#145cac"/><circle cx="790" cy="288" r="9" fill="#bd7824"/><path d="M545 278 L545 203" fill="none" stroke="#527196" stroke-width="3"/><text x="386" y="177" class="accent" font-size="24">tag_barrel_attach</text><path d="M378 349 L378 464" fill="none" stroke="#527196" stroke-width="3"/><text x="200" y="500" class="accent" font-size="24">tag_mag_attach</text><path d="M790 278 L790 203" fill="none" stroke="#527196" stroke-width="3"/><text x="700" y="177" class="text" font-size="23">tag_flash</text><rect x="32" y="110" width="284" height="82" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="50" y="143" class="text" font-size="23">主枪保留挂点</text><text x="50" y="174" class="muted" font-size="19">位于随枪运动的分支</text><text x="32" y="552" class="text" font-size="25">anchor_node: "tag_barrel_attach"</text><text x="32" y="591" class="muted" font-size="20">示例位置而非固定坐标；部件与主枪必须使用匹配参考空间。</text></svg>
