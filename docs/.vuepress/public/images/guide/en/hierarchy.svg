<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">First-person hierarchy: parent to child</title><desc id="desc">Lines represent actual parent relationships, not a naming list.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#527196"/></marker></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172b45}.muted{fill:#506783}.accent{fill:#145cac}.good{fill:#17643d}.bad{fill:#a83232}</style><rect width="960" height="630" rx="18" fill="#fff"/><text x="32" y="48" class="text" font-size="30">First-person hierarchy: parent to child</text><text x="32" y="80" class="muted" font-size="19">Lines represent actual parent relationships, not a naming list.</text><rect x="42" y="108" width="215" height="54" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="60" y="141" class="text" font-size="23">root</text><path d="M148 162 L148 183" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="197" width="215" height="54" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="60" y="230" class="text" font-size="23">tag_view</text><path d="M257 224 L555 224" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="574" y="197" width="332" height="83" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="592" y="230" class="text" font-size="23">tag_camera</text><text x="592" y="261" class="muted" font-size="19">Camera animation only; no gun parts</text><path d="M148 251 L148 272" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="287" width="215" height="54" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="60" y="320" class="text" font-size="23">tag_ads</text><path d="M148 341 L148 362" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="377" width="215" height="54" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="60" y="410" class="text" font-size="23">tag_weapon</text><path d="M148 431 L148 452" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="467" width="215" height="54" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="60" y="500" class="text" font-size="23">Weapon body</text><text x="310" y="315" class="accent" font-size="23">tag_camera and tag_ads are siblings</text><text x="310" y="355" class="text" font-size="23">tag_weapon is a child of tag_ads</text><path d="M257 494 L542 494" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="560" y="450" width="346" height="95" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="578" y="483" class="text" font-size="23">Moving parts and anchors</text><text x="578" y="514" class="muted" font-size="19">tag_brass · tag_cosmetic</text><text x="42" y="584" class="muted" font-size="21">All routes share these roles; mechanisms belong under the weapon branch.</text><text x="310" y="130" class="text" font-size="19">Blender skinning: root is an Armature object, not a bone</text><text x="310" y="164" class="muted" font-size="19">Empty route: Empty object · Bedrock route: root group</text></svg>
