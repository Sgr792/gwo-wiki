<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="title desc"><title id="title">Choose one authoring route</title><desc id="desc">Different authoring tools; shared configuration and in-game checks.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#527196"/></marker></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172b45}.muted{fill:#506783}.accent{fill:#145cac}.good{fill:#17643d}.bad{fill:#a83232}</style><rect width="960" height="610" rx="18" fill="#fff"/><text x="32" y="48" class="text" font-size="30">Choose one authoring route</text><text x="32" y="80" class="muted" font-size="19">Different authoring tools; shared configuration and in-game checks.</text><rect x="32" y="112" width="430" height="85" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="50" y="145" class="text" font-size="23">Blender · Armature</text><text x="50" y="176" class="muted" font-size="19">Bones + mesh weights → GLB</text><rect x="32" y="220" width="430" height="85" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="50" y="253" class="text" font-size="23">Blender · Empty</text><text x="50" y="284" class="muted" font-size="19">Parent nodes + rigid meshes → GLB</text><rect x="32" y="328" width="430" height="85" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="50" y="361" class="text" font-size="23">Blockbench · Bedrock</text><text x="50" y="392" class="muted" font-size="19">Groups + cubes + numeric keys → JSON</text><path d="M465 155 L525 155" fill="none" stroke="#527196" stroke-width="3"/><path d="M465 262 L525 262" fill="none" stroke="#527196" stroke-width="3"/><path d="M465 370 L525 370" fill="none" stroke="#527196" stroke-width="3"/><path d="M525 155 L525 370" fill="none" stroke="#527196" stroke-width="3"/><path d="M525 262 L570 262" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="217" width="340" height="95" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="598" y="250" class="text" font-size="23">Shared pack configuration</text><text x="598" y="281" class="muted" font-size="19">Behavior / materials / events</text><path d="M750 312 L750 355" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="373" width="340" height="85" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="598" y="406" class="text" font-size="23">In-game checks</text><text x="598" y="437" class="muted" font-size="19">Display → fire → reload</text><text x="32" y="525" class="text" font-size="23">You do not need to learn both Blender and Blockbench.</text><text x="32" y="566" class="muted" font-size="21">Start with a loadable model; add detail and attachments later.</text></svg>
