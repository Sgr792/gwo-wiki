<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">How texture files connect to game materials</title><desc id="desc">Blender material nodes are not a substitute for GWO render configuration.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#527196"/></marker></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172b45}.muted{fill:#506783}.accent{fill:#145cac}.good{fill:#17643d}.bad{fill:#a83232}</style><rect width="960" height="640" rx="18" fill="#fff"/><text x="32" y="48" class="text" font-size="30">How texture files connect to game materials</text><text x="32" y="80" class="muted" font-size="19">Blender material nodes are not a substitute for GWO render configuration.</text><rect x="32" y="110" width="62" height="62" rx="9" fill="#b69b75"/><text x="113" y="135" class="accent" font-size="24">texture</text><text x="113" y="166" class="muted" font-size="20">Base color + alpha</text><path d="M430 140 L488 140" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="511" y="107" width="416" height="77" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="529" y="140" class="text" font-size="23">Render JSON</text><text x="529" y="171" class="muted" font-size="19">"texture": "example:skins/..."</text><rect x="32" y="213" width="62" height="62" rx="9" fill="#8d85e8"/><text x="113" y="238" class="accent" font-size="24">normal</text><text x="113" y="269" class="muted" font-size="20">Tangent-space normals</text><path d="M430 243 L488 243" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="511" y="210" width="416" height="77" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="529" y="243" class="text" font-size="23">Render JSON</text><text x="529" y="274" class="muted" font-size="19">"normal": "example:skins/..."</text><rect x="32" y="316" width="62" height="62" rx="9" fill="#c44835"/><text x="113" y="341" class="accent" font-size="24">specular</text><text x="113" y="372" class="muted" font-size="20">Specular / PBR material data</text><path d="M430 346 L488 346" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="511" y="313" width="416" height="77" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="529" y="346" class="text" font-size="23">Render JSON</text><text x="529" y="377" class="muted" font-size="19">"specular": "example:skins/..."</text><rect x="32" y="419" width="62" height="62" rx="9" fill="#e9be47"/><text x="113" y="444" class="accent" font-size="24">emissive</text><text x="113" y="475" class="muted" font-size="20">RGB emission + alpha mask</text><path d="M430 449 L488 449" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="511" y="416" width="416" height="77" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="529" y="449" class="text" font-size="23">Render JSON</text><text x="529" y="480" class="muted" font-size="19">"emissive": "example:skins/..."</text><text x="32" y="563" class="muted" font-size="20">Swatches label map categories; they are not usable texture files.</text><text x="32" y="600" class="text" font-size="20">Iris follows shaderpack PBR conventions; configure materials on modules too.</text></svg>
