<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 646" role="img" aria-labelledby="title desc"><title id="title">Match a resource ID to its file</title><desc id="desc">Uses the tutorial namespace from the First Firearm guide.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#527196"/></marker></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172b45}.muted{fill:#506783}.accent{fill:#145cac}.good{fill:#17643d}.bad{fill:#a83232}</style><rect width="960" height="646" rx="18" fill="#fff"/><text x="32" y="48" class="text" font-size="30">Match a resource ID to its file</text><text x="32" y="80" class="muted" font-size="19">Uses the tutorial namespace from the First Firearm guide.</text><rect x="32" y="111" width="895" height="89" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="50" y="144" class="text" font-size="23">Resource ID in configuration</text><text x="50" y="175" class="muted" font-size="19">tutorial:skins/guns/training_rifle.png</text><path d="M475 201 L475 233" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="251" width="895" height="89" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="50" y="284" class="text" font-size="23">Actual file inside the content pack</text><text x="50" y="315" class="muted" font-size="19">assets/tutorial/skins/guns/training_rifle.png</text><text x="32" y="396" class="accent" font-size="24">Before colon: namespace</text><text x="540" y="396" class="accent" font-size="24">After colon: resource path</text><rect x="32" y="426" width="434" height="88" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="50" y="459" class="text" font-size="23">tutorial</text><text x="50" y="490" class="muted" font-size="19">assets/tutorial/</text><rect x="498" y="426" width="429" height="88" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="516" y="459" class="text" font-size="23">skins/guns/…</text><text x="516" y="490" class="muted" font-size="19">skins/guns/training_rifle.png</text><text x="32" y="566" class="text" font-size="21">Check paths before materials; do not put disk-absolute paths in JSON.</text><text x="32" y="604" class="muted" font-size="20">Applies to resource IDs such as textures, not every JSON field.</text></svg>
