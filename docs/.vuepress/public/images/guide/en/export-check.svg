<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Export succeeded does not mean export is correct</title><desc id="desc">Check in an empty project first, then validate the actual game result.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#527196"/></marker></defs><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172b45}.muted{fill:#506783}.accent{fill:#145cac}.good{fill:#17643d}.bad{fill:#a83232}</style><rect width="960" height="640" rx="18" fill="#fff"/><text x="32" y="48" class="text" font-size="30">Export succeeded does not mean export is correct</text><text x="32" y="80" class="muted" font-size="19">Check in an empty project first, then validate the actual game result.</text><rect x="32" y="110" width="895" height="87" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="50" y="143" class="text" font-size="23">Keep editable source projects</text><text x="50" y="174" class="muted" font-size="19">Blender: .blend    /    Blockbench: .bbmodel</text><path d="M475 198 L475 225" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="243" width="433" height="112" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="50" y="276" class="text" font-size="23">Blender export</text><text x="50" y="307" class="muted" font-size="19">Model .glb + animation .anim.glb</text><rect x="498" y="243" width="429" height="112" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="516" y="276" class="text" font-size="23">Blockbench export</text><text x="516" y="307" class="muted" font-size="19">.geo.json + .animation.json + .png</text><text x="50" y="338" class="muted" font-size="19">Include required bones / Empty nodes</text><text x="516" y="338" class="muted" font-size="19">Do not use .bbmodel as runtime model</text><path d="M242 355 L242 400" fill="none" stroke="#527196" stroke-width="3"/><path d="M710 355 L710 400" fill="none" stroke="#527196" stroke-width="3"/><path d="M242 400 L710 400" fill="none" stroke="#527196" stroke-width="3"/><path d="M475 400 L475 437" fill="none" stroke="#527196" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="455" width="895" height="87" rx="12" fill="#edf3fb" stroke="#c6d5e8"/><text x="50" y="488" class="text" font-size="23">Reimport → inspect → integrate</text><text x="50" y="519" class="muted" font-size="19">Node names · parents · initial transforms · clip names and duration</text><text x="32" y="594" class="text" font-size="22">When exporting separately, model and animation must share reference space.</text></svg>
